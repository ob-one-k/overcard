# Render Blueprint — API web service + PostgreSQL.
# Paid plans: an always-on instance (live updates hold connections open; the free tier
# sleeps after 15 minutes) and a database with daily backups and no expiry.
# Plan names/prices: https://render.com/pricing — syncing this file changes billing.
services:
  - type: web
    name: overcard-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: MASTER_CODE
        sync: false
      # Public URL of the app — used in owner recovery links (npm run owner-reset)
      - key: APP_URL
        sync: false
      # Production: no demo orgs, no one-click demo sign-in. "on" re-seeds the demo
      # orgs on every boot — only for a demo deployment.
      - key: DEMO_MODE
        value: "off"
      # bcrypt runs on libuv's pool — more threads keep a burst of sign-ins fast
      - key: UV_THREADPOOL_SIZE
        value: "8"
      - key: DATABASE_URL
        fromDatabase:
          name: overcard-db
          property: connectionString

databases:
  - name: overcard-db
    plan: basic-256mb
    databaseName: overcard
    user: overcard
