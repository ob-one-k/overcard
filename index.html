<html lang="en">

    <meta name="theme-color" content="#090c18" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>html,body,#root{height:100%;margin:0}body{background:#060d1a;font-family:'Inter',sans-serif}</style>
  </head>
